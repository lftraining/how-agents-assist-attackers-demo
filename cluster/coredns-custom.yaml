# coredns-custom.yaml — the demo's hostnames in cluster DNS.
#
# This is a template. `make up` fills in the attacker IPs with scripts/render-config.sh and
# applies the copy in .runtime/rendered/. The `.:53` block is the stock Kubernetes v1.32
# default.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system   # = COREDNS_NS
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    # The demo zone, answered here and never forwarded. The stanzas run in order:
    #   1-2. A records for the two demo names.
    #   3.   An empty answer for any other record type of those names.
    #   4.   "No such name" for anything else in the zone.
    corewave.test:53 {
        errors
        log
        template IN A corewave.test {
            match "^docs\.corewave\.test\.$"
            answer "docs.corewave.test. 60 IN A __VENDOR_DOCS_IP__"
            fallthrough
        }
        template IN A corewave.test {
            match "^telemetry\.corewave\.test\.$"
            answer "telemetry.corewave.test. 60 IN A __COLLECTOR_IP__"
            fallthrough
        }
        template ANY ANY {
            match "^(docs|telemetry)\.corewave\.test\.$"
            rcode NOERROR
            authority "{{ .Zone }} 60 IN SOA ns.{{ .Zone }} hostmaster.{{ .Zone }} 1 60 60 60 60"
            fallthrough
        }
        template ANY ANY {
            rcode NXDOMAIN
            authority "{{ .Zone }} 60 IN SOA ns.{{ .Zone }} hostmaster.{{ .Zone }} 1 60 60 60 60"
        }
    }
    # Answer the `localdomain` search suffix locally.
    localdomain:53 {
        errors
        template ANY ANY {
            rcode NXDOMAIN
            authority "localdomain. 60 IN SOA ns.localdomain. hostmaster.localdomain. 1 60 60 60 60"
        }
        cache 60
    }
